id: postgresql
php-extensions:
  - pgsql
  - pdo_pgsql
install-candidates:
  windows-amd64:
    - bin/psql.exe
    - psql.exe
  linux-amd64:
    - bin/psql
    - psql
dispatch-commands:
  - psql
logs:
  error:
    - server.log
download:
  github:
    owner: theseus-rs
    repo: postgresql-binaries
  assets:
    windows-amd64:
      filename: postgresql-{version}-x86_64-pc-windows-msvc.zip
      url: https://github.com/theseus-rs/postgresql-binaries/releases/download/{tag}/postgresql-{version}-x86_64-pc-windows-msvc.zip
      checksum-url: https://github.com/theseus-rs/postgresql-binaries/releases/download/{tag}/postgresql-{version}-x86_64-pc-windows-msvc.zip.sha256
      checksum-algorithm: sha256
      archive-format: zip
    linux-amd64:
      filename: postgresql-{version}-x86_64-unknown-linux-gnu.tar.gz
      url: https://github.com/theseus-rs/postgresql-binaries/releases/download/{tag}/postgresql-{version}-x86_64-unknown-linux-gnu.tar.gz
      checksum-url: https://github.com/theseus-rs/postgresql-binaries/releases/download/{tag}/postgresql-{version}-x86_64-unknown-linux-gnu.tar.gz.sha256
      checksum-algorithm: sha256
      archive-format: tar.gz
