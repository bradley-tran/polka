id: php
dispatch-priority: 20
exclusive-with:
  - php-zts
settings:
  extension-sdk: bool
install-candidates:
  windows-amd64:
    - bin/php.exe
    - bin/php.cmd
    - bin/php.bat
    - php.exe
    - php.cmd
    - php.bat
  linux-amd64:
    - bin/php
    - php
dispatch-commands:
  - php
download:
  assets:
    windows-amd64:
      filename: "{php_filename}"
      url: https://windows.php.net/downloads/releases/{php_filename}
      checksum-algorithm: sha256
      archive-format: zip
script:
  file: scripts/php.star
  hooks: [resolve, dependencies]
  vars:
    release-index: https://windows.php.net/downloads/releases/releases.json
    flavor: nts
    php-sdk-version: 2.8.3
