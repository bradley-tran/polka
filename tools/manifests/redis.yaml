id: redis
settings:
  port: port
  password: string
install-candidates:
  windows-amd64:
    - redis-server.exe
  linux-amd64:
    - redis-server
dispatch-commands:
  - redis-server
  - redis-cli
dispatch-candidates:
  redis-cli:
    windows-amd64:
      - redis-cli.exe
    linux-amd64:
      - redis-cli
logs:
  info:
    - redis.log
download:
  github:
    owner: zkteco-home
    repo: redis-windows
  assets:
    windows-amd64:
      filename: redis-windows-{version}.zip
      url: https://github.com/zkteco-home/redis-windows/archive/refs/tags/{tag}.zip
      checksum-algorithm: embedded-commit-id
      archive-format: zip
script:
  file: scripts/redis.star
  hooks: [build_sources]
  vars:
    source-hashes: https://raw.githubusercontent.com/redis/redis-hashes/master/README
    source-base: https://download.redis.io/releases/
build:
  platforms: [linux-amd64]
  requires:
    commands: ["cc|gcc", make]
  stages:
    - name: redis
      source: redis
      make: [BUILD_TLS=no, USE_SYSTEMD=no]
  package:
    copy:
      - from: src/redis-server
        to: redis-server
      - from: src/redis-cli
        to: redis-cli
  verify:
    - [redis-server, --version]
    - [redis-cli, --version]
