id: phpmyadmin
settings:
  port: port
install-candidates:
  all:
    - index.php
logs:
  info:
    - logs/access.log
  error:
    - logs/error.log
  debug:
    - serve.log
    - php.log
download:
  release-index:
    url: https://www.phpmyadmin.net/downloads/
    pattern: 'phpMyAdmin-([0-9]+\.[0-9]+\.[0-9]+)-all-languages\.zip'
  assets:
    all:
      filename: phpMyAdmin-{version}-all-languages.zip
      url: https://files.phpmyadmin.net/phpMyAdmin/{version}/phpMyAdmin-{version}-all-languages.zip
      checksum-url: https://files.phpmyadmin.net/phpMyAdmin/{version}/phpMyAdmin-{version}-all-languages.zip.sha256
      checksum-algorithm: sha256
      archive-format: zip
script:
  file: scripts/phpmyadmin.star
  hooks: [post_install]
