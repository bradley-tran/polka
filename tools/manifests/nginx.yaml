id: nginx
install-candidates:
  windows-amd64:
    - nginx.exe
    - sbin/nginx.exe
  linux-amd64:
    - sbin/nginx
    - nginx
dispatch-commands:
  - nginx
logs:
  info:
    - run/serve/{environment}/logs/access.log
  error:
    - run/serve/{environment}/logs/error.log
  debug:
    - run/serve/{environment}/serve.log
    - run/serve/{environment}/php.log
download:
  assets:
    windows-amd64:
      filename: nginx-{version}.zip
      url: https://nginx.org/download/nginx-{version}.zip
      archive-format: zip
