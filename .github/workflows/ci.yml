name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system libraries (Linux)
        if: runner.os != 'Windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y libyaml-dev liblzma-dev libssl-dev libcurl4-openssl-dev pkg-config

      - name: Set up D toolchain
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest

      - name: Run tests
        run: dub test

      - name: Build
        run: dub build
