id: php-extension
description: Native PHP extension (C source) development environment
defaults:
  tools:
    php: "8.4"
    composer: "2.8"
  settings:
    php:
      extension-sdk: true
  memory-limit: "-1"
  env-vars:
    NO_INTERACTION: "1"
    REPORT_EXIT_STATUS: "1"
    USE_ZEND_ALLOC: "0"
    ZEND_DONT_UNLOAD_MODULES: "1"
scaffold:
  - path: composer.json
    template-file: php-extension.composer.json
