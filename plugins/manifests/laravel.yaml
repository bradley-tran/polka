id: laravel
database-engines:
  - mysql
  - mariadb
  - postgresql
defaults:
  docroot: public
  tools:
    php: "8.4"
    composer: "2.8"
    nodejs: "24"
    nginx: "1.30"
    mariadb: "11.8"
    mailpit: "1.30"
    phpmyadmin: "5.2"
  settings:
    mailpit:
      smtp-port: 1025
      ui-port: 8025
    phpmyadmin:
      port: 8082
  database:
    engine: mariadb
    port: 3306
  opcache-preset: dev
  workers:
    queue:
      command: php artisan queue:work
php-extensions:
  - bcmath
  - curl
  - dom
  - fileinfo
  - gd
  - intl
  - mbstring
  - opcache
  - openssl
  - pdo_sqlite
  - simplexml
  - sqlite3
  - xmlreader
  - xsl
  - zip
runtime-env:
  database:
    keys: standard
    connection: mysql
post-composer:
  strategy: dotenv
  app-root:
    public-dir: public
    framework: laravel
  dotenv:
    target: .env
    template: .env.example
    values:
      - DB_CONNECTION
      - DB_HOST
      - DB_PORT
      - DB_DATABASE
      - DB_USERNAME
      - DB_PASSWORD
