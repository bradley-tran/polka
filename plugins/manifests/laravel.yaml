id: laravel
database-engines:
  - mysql
  - mariadb
  - postgresql
defaults:
  docroot: public
  tools:
    php: "8.4"
    composer: "2.8"
    nodejs: "24"
    nginx: "1.30"
    mariadb: "11.8"
    mailpit: "1.30"
    phpmyadmin: "5.2"
  settings:
    mailpit:
      smtp-port: 1025
      ui-port: 8025
    phpmyadmin:
      port: 8082
  database:
    engine: mariadb
    port: 3306
  opcache-preset: dev
  workers:
    queue:
      command: php artisan queue:work
php-extensions:
  - bcmath
  - curl
  - dom
  - fileinfo
  - gd
  - intl
  - mbstring
  - opcache
  - openssl
  - pdo_sqlite
  - simplexml
  - sqlite3
  - xmlreader
  - xsl
  - zip
detection:
  package-prefixes:
    - "laravel/"
  markers:
    - "artisan"
  priority: 60
app-root:
  public-dir: "public"
  markers:
    - "artisan"
    - ".env"
    - ".env.example"
    - "composer.json"
runtime-env:
  requires-database: true
  values:
    DB_CONNECTION:
      by-engine:
        mysql: "mysql"
        mariadb: "mysql"
        postgresql: "pgsql"
    DB_HOST:
      from: "database.host"
    DB_PORT:
      from: "database.port"
    DB_DATABASE:
      from: "database.name"
    DB_USERNAME:
      from: "database.user"
    DB_PASSWORD:
      from: "database.password"
script:
  file: "scripts/laravel.star"
  hooks:
    - "post_composer"
post-composer:
  requires-database: true
