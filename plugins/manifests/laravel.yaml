id: laravel
database-engines:
  - mysql
  - mariadb
  - postgresql
defaults:
  docroot: public
  tools:
    php: "8.4"
    composer: "2.8"
    nodejs: "24"
    nginx: "1.30"
    mariadb: "11.8"
    mailpit: "1.30"
    phpmyadmin: "5.2"
  database:
    engine: mariadb
  opcache-preset: dev
  workers:
    queue:
      command: php artisan queue:work
php-extensions:
  - bcmath
  - curl
  - dom
  - fileinfo
  - gd
  - intl
  - mbstring
  - opcache
  - openssl
  - pdo_sqlite
  - simplexml
  - sqlite3
  - xmlreader
  - xsl
  - zip
detection:
  package-prefixes:
    - "laravel/"
  markers:
    - "artisan"
  priority: 60
app-root:
  public-dir: "public"
  markers:
    - "artisan"
    - ".env"
    - ".env.example"
    - "composer.json"
runtime-env:
  requires-database: true
  values:
    DB_CONNECTION:
      by-engine:
        mysql: "mysql"
        mariadb: "mysql"
        postgresql: "pgsql"
    DB_HOST:
      from: "database.host"
    DB_PORT:
      from: "database.port"
    DB_DATABASE:
      from: "database.name"
    DB_USERNAME:
      from: "database.user"
    DB_PASSWORD:
      from: "database.password"
  # Point Laravel at this project's own managed services, whose ports are
  # leased per project, overriding stale skeleton .env defaults.
  service-values:
    mailpit:
      MAIL_HOST:
        from: "mailpit.smtp-host"
      MAIL_PORT:
        from: "mailpit.smtp-port"
    redis:
      REDIS_HOST:
        from: "redis.host"
      REDIS_PORT:
        from: "redis.port"
      REDIS_PASSWORD:
        from: "redis.password"
        default: "null"
    meilisearch:
      MEILISEARCH_HOST:
        from: "meilisearch.url"
      MEILISEARCH_KEY:
        from: "meilisearch.key"
script:
  file: "scripts/laravel.star"
  hooks:
    - "post_composer"
post-composer:
  requires-database: true
