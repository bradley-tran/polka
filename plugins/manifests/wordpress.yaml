id: wordpress
database-engines:
  - mysql
  - mariadb
defaults:
  docroot: .
  tools:
    php: "8.4"
    nginx: "1.30"
    mariadb: "11.8"
    phpmyadmin: "5.2"
  settings:
    phpmyadmin:
      port: 8082
  database:
    engine: mariadb
    port: 3306
  opcache-preset: dev
php-extensions:
  - bcmath
  - curl
  - dom
  - exif
  - fileinfo
  - ftp
  - gd
  - iconv
  - intl
  - mbstring
  - opcache
  - openssl
  - shmop
  - simplexml
  - sockets
  - sodium
  - xmlreader
  - xsl
  - zip
  - zlib
detection:
  package-prefixes:
    - "roots/"
  markers:
    - "wp-load.php"
    - "wp-config-sample.php"
  priority: 30
  package-substrings:
    - "wordpress"
app-root:
  public-dir: "."
  markers:
    - "wp-config.php"
    - "wp-config-sample.php"
    - "wp-load.php"
    - "composer.json"
runtime-env:
  requires-database: true
  values:
    DB_HOST:
      from: "database.host"
    DB_PORT:
      from: "database.port"
    DB_DATABASE:
      from: "database.name"
    DB_USERNAME:
      from: "database.user"
    DB_PASSWORD:
      from: "database.password"
post-composer:
  requires-database: true
  actions:
    - type: "php-constants"
      path: "wp-config.php"
      fallback: "wp-config-sample.php"
      fallback-template-file: "wordpress-config.php"
      insert-before: "DB_CHARSET"
      values:
        DB_NAME:
          from: "database.name"
        DB_USER:
          from: "database.user"
        DB_PASSWORD:
          from: "database.password"
        DB_HOST:
          format:
            kind: "host-port"
            host:
              from: "database.host"
            port:
              from: "database.port"
            omit-port: "3306"
      order:
        - "DB_NAME"
        - "DB_USER"
        - "DB_PASSWORD"
        - "DB_HOST"
