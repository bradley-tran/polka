id: drupal
database-engines:
  - mysql
  - mariadb
  - postgresql
defaults:
  docroot: web
  tools:
    php: "8.4"
    composer: "2.8"
    nodejs: "24"
    nginx: "1.30"
    mariadb: "11.8"
    mailpit: "1.30"
    phpmyadmin: "5.2"
  settings:
    mailpit:
      smtp-port: 1025
      ui-port: 8025
    phpmyadmin:
      port: 8082
  database:
    engine: mariadb
    port: 3306
  opcache-preset: dev
php-extensions:
  - curl
  - dom
  - fileinfo
  - gd
  - intl
  - mbstring
  - opcache
  - openssl
  - pdo_sqlite
  - simplexml
  - sqlite3
  - xmlreader
  - xsl
  - zip
  - zlib
opcache-config:
  opcache.save_comments: "1"
detection:
  package-prefixes:
    - "drupal/"
  markers:
    - "web/sites/default/default.settings.php"
  priority: 20
app-root:
  public-dir: "web"
  markers:
    - "composer.json"
    - "web/sites/default/default.settings.php"
    - "sites/default/default.settings.php"
runtime-env:
  requires-database: true
  values:
    DB_HOST:
      from: "database.host"
    DB_PORT:
      from: "database.port"
    DB_DATABASE:
      from: "database.name"
    DB_USERNAME:
      from: "database.user"
    DB_PASSWORD:
      from: "database.password"
post-composer:
  requires-database: true
  actions:
    - type: "write-file"
      base: "docroot"
      path: "sites/default/settings.polka.php"
      template-file: "drupal-settings.php"
      encoding: "php-literal"
      values:
        database:
          from: "database.name"
        username:
          from: "database.user"
        password:
          from: "database.password"
        host:
          from: "database.host"
        port:
          from: "database.port"
        namespace:
          by-engine:
            mysql: "Drupal\\mysql\\Driver\\Database\\mysql"
            mariadb: "Drupal\\mysql\\Driver\\Database\\mysql"
            postgresql: "Drupal\\pgsql\\Driver\\Database\\pgsql"
        driver:
          by-engine:
            mysql: "mysql"
            mariadb: "mysql"
            postgresql: "pgsql"
        autoload:
          by-engine:
            mysql: "core/modules/mysql/src/Driver/Database/mysql/"
            mariadb: "core/modules/mysql/src/Driver/Database/mysql/"
            postgresql: "core/modules/pgsql/src/Driver/Database/pgsql/"
    - type: "php-include"
      base: "docroot"
      path: "sites/default/settings.php"
      fallback: "sites/default/default.settings.php"
      include: "settings.polka.php"
      marker: "settings-polka"
