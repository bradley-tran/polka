id: symfony
database-engines:
  - mysql
  - mariadb
  - postgresql
defaults:
  docroot: public
  tools:
    php: "8.4"
    composer: "2.8"
    nodejs: "24"
    nginx: "1.30"
    mariadb: "11.8"
    mailpit: "1.30"
    phpmyadmin: "5.2"
  settings:
    mailpit:
      smtp-port: 1025
      ui-port: 8025
    phpmyadmin:
      port: 8082
  database:
    engine: mariadb
    port: 3306
  opcache-preset: dev
  workers:
    messenger:
      command: php bin/console messenger:consume async
php-extensions:
  - ctype
  - curl
  - dom
  - fileinfo
  - gd
  - iconv
  - intl
  - mbstring
  - opcache
  - openssl
  - pdo_sqlite
  - session
  - simplexml
  - sqlite3
  - tokenizer
  - xmlreader
  - zip
runtime-env:
  database:
    keys: standard
    database-url: symfony
post-composer:
  strategy: dotenv
  app-root:
    public-dir: public
    framework: symfony
  dotenv:
    target: .env.local
    values:
      - DATABASE_URL
