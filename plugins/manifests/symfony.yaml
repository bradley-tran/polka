id: symfony
database-engines:
  - mysql
  - mariadb
  - postgresql
defaults:
  docroot: public
  tools:
    php: "8.4"
    composer: "2.8"
    nodejs: "24"
    nginx: "1.30"
    mariadb: "11.8"
    mailpit: "1.30"
    phpmyadmin: "5.2"
  settings:
    mailpit:
      smtp-port: 1025
      ui-port: 8025
    phpmyadmin:
      port: 8082
  database:
    engine: mariadb
    port: 3306
  opcache-preset: dev
  workers:
    messenger:
      command: php bin/console messenger:consume async
php-extensions:
  - ctype
  - curl
  - dom
  - fileinfo
  - gd
  - iconv
  - intl
  - mbstring
  - opcache
  - openssl
  - pdo_sqlite
  - session
  - simplexml
  - sqlite3
  - tokenizer
  - xmlreader
  - zip
detection:
  package-prefixes:
    - "symfony/"
  markers:
    - "symfony.lock"
    - "bin/console"
  priority: 10
app-root:
  public-dir: "public"
  markers:
    - "bin/console"
    - ".env"
    - ".env.local"
    - "composer.json"
values:
  scheme:
    by-engine:
      mysql: "mysql"
      mariadb: "mysql"
      postgresql: "postgresql"
  charset:
    by-engine:
      mysql: "utf8mb4"
      mariadb: "utf8mb4"
      postgresql: "utf8"
  server-version:
    by-engine:
      mariadb:
        format:
          kind: "version"
          value:
            from: "database.version"
            default: "11.8"
          strip-prefix: "mariadb-"
          min-parts: 3
          prefix: "mariadb-"
      mysql:
        from: "database.version"
        default: "mysql"
      postgresql:
        from: "database.version"
runtime-env:
  requires-database: true
  values:
    DB_HOST:
      from: "database.host"
    DB_PORT:
      from: "database.port"
    DB_DATABASE:
      from: "database.name"
    DB_USERNAME:
      from: "database.user"
    DB_PASSWORD:
      from: "database.password"
    DATABASE_URL:
      format:
        kind: "url"
        scheme:
          from: "values.scheme"
        user:
          from: "database.user"
        password:
          from: "database.password"
        host:
          from: "database.host"
        port:
          from: "database.port"
        path:
          from: "database.name"
        query:
          charset:
            from: "values.charset"
          serverVersion:
            from: "values.server-version"
post-composer:
  requires-database: true
  actions:
    - type: "dotenv"
      path: ".env.local"
      values:
        DATABASE_URL:
          from: "runtime-env.DATABASE_URL"
      order:
        - "DATABASE_URL"
