id: cakephp
database-engines:
  - mysql
  - mariadb
  - postgresql
defaults:
  docroot: webroot
  tools:
    php: "8.4"
    composer: "2.8"
    nodejs: "24"
    nginx: "1.30"
    mariadb: "11.8"
    mailpit: "1.30"
    phpmyadmin: "5.2"
  settings:
    mailpit:
      smtp-port: 1025
      ui-port: 8025
    phpmyadmin:
      port: 8082
  database:
    engine: mariadb
    port: 3306
  opcache-preset: dev
php-extensions:
  - intl
  - mbstring
  - opcache
  - openssl
  - simplexml
detection:
  package-prefixes:
    - "cakephp/"
  markers:
    - "bin/cake"
  priority: 50
app-root:
  public-dir: "webroot"
  markers:
    - "bin/cake"
    - "config/app.php"
    - "config/app_local.php"
    - "composer.json"
runtime-env:
  requires-database: true
  values:
    DB_HOST:
      from: "database.host"
    DB_PORT:
      from: "database.port"
    DB_DATABASE:
      from: "database.name"
    DB_USERNAME:
      from: "database.user"
    DB_PASSWORD:
      from: "database.password"
script:
  file: "scripts/cakephp.star"
  hooks:
    - "post_composer"
post-composer:
  requires-database: true
