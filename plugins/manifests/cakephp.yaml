id: cakephp
defaults:
  docroot: webroot
  tools:
    php: "8.4"
    composer: "2.8"
    nodejs: "24"
    nginx: "1.30"
    mariadb: "11.8"
    mailpit: "1.30"
    phpmyadmin: "5.2"
  settings:
    mailpit:
      smtp-port: 1025
      ui-port: 8025
    phpmyadmin:
      port: 8082
  database:
    engine: mariadb
    port: 3306
  opcache-preset: dev
php-extensions:
  - intl
  - mbstring
  - mysqli
  - opcache
  - openssl
  - pdo_mysql
  - simplexml
runtime-env:
  database:
    keys: standard
post-composer:
  strategy: cakephp-config
  app-root:
    public-dir: webroot
    framework: cakephp
