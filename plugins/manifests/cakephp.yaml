id: cakephp
database-engines:
  - mysql
  - mariadb
  - postgresql
defaults:
  docroot: webroot
  tools:
    php: "8.4"
    composer: "2.8"
    nodejs: "24"
    nginx: "1.30"
    mariadb: "11.8"
    mailpit: "1.30"
    phpmyadmin: "5.2"
  settings:
    mailpit:
      smtp-port: 1025
      ui-port: 8025
    phpmyadmin:
      port: 8082
  database:
    engine: mariadb
    port: 3306
  opcache-preset: dev
php-extensions:
  - intl
  - mbstring
  - opcache
  - openssl
  - simplexml
detection:
  package-prefixes:
    - "cakephp/"
  markers:
    - "bin/cake"
  priority: 50
app-root:
  public-dir: "webroot"
  markers:
    - "bin/cake"
    - "config/app.php"
    - "config/app_local.php"
    - "composer.json"
values:
  className: "Cake\\Database\\Connection"
  driver:
    by-engine:
      mysql: "Cake\\Database\\Driver\\Mysql"
      mariadb: "Cake\\Database\\Driver\\Mysql"
      postgresql: "Cake\\Database\\Driver\\Postgres"
  host:
    from: "database.host"
  port:
    from: "database.port"
  username:
    from: "database.user"
  password:
    from: "database.password"
  database:
    from: "database.name"
  encoding:
    by-engine:
      mysql: "utf8mb4"
      mariadb: "utf8mb4"
      postgresql: "utf8"
  url: null
runtime-env:
  requires-database: true
  values:
    DB_HOST:
      from: "database.host"
    DB_PORT:
      from: "database.port"
    DB_DATABASE:
      from: "database.name"
    DB_USERNAME:
      from: "database.user"
    DB_PASSWORD:
      from: "database.password"
post-composer:
  requires-database: true
  actions:
    - type: "php-array"
      path: "config/app_local.php"
      fallback: "config/app_local.example.php"
      fallback-template-file: "php-return-array.php"
      updates:
        - path:
            - "Datasources"
            - "default"
          values:
            className:
              from: "values.className"
            driver:
              from: "values.driver"
            host:
              from: "values.host"
            port:
              from: "values.port"
            username:
              from: "values.username"
            password:
              from: "values.password"
            database:
              from: "values.database"
            encoding:
              from: "values.encoding"
            url:
              from: "values.url"
          order:
            - "className"
            - "driver"
            - "host"
            - "port"
            - "username"
            - "password"
            - "database"
            - "encoding"
            - "url"
        - path:
            - "Datasources"
            - "test"
          values:
            className:
              from: "values.className"
            driver:
              from: "values.driver"
            host:
              from: "values.host"
            port:
              from: "values.port"
            username:
              from: "values.username"
            password:
              from: "values.password"
            database:
              from: "values.database"
            encoding:
              from: "values.encoding"
            url:
              from: "values.url"
          order:
            - "className"
            - "driver"
            - "host"
            - "port"
            - "username"
            - "password"
            - "database"
            - "encoding"
            - "url"
        - path:
            - "Datasources"
            - "debug_kit"
          values:
            className:
              from: "values.className"
            driver:
              from: "values.driver"
            host:
              from: "values.host"
            port:
              from: "values.port"
            username:
              from: "values.username"
            password:
              from: "values.password"
            database:
              from: "values.database"
            encoding:
              from: "values.encoding"
            url:
              from: "values.url"
          order:
            - "className"
            - "driver"
            - "host"
            - "port"
            - "username"
            - "password"
            - "database"
            - "encoding"
            - "url"
