id: codeigniter
database-engines:
  - mysql
  - mariadb
  - postgresql
defaults:
  docroot: public
  tools:
    php: "8.4"
    composer: "2.8"
    nodejs: "24"
    nginx: "1.30"
    mariadb: "11.8"
    mailpit: "1.30"
    phpmyadmin: "5.2"
  settings:
    mailpit:
      smtp-port: 1025
      ui-port: 8025
    phpmyadmin:
      port: 8082
  database:
    engine: mariadb
    port: 3306
  opcache-preset: dev
php-extensions:
  - curl
  - fileinfo
  - intl
  - mbstring
  - opcache
  - openssl
  - zip
detection:
  package-prefixes:
    - "codeigniter4/"
  markers:
    - "spark"
  priority: 40
app-root:
  public-dir: "public"
  markers:
    - "spark"
    - "env"
    - ".env"
    - "composer.json"
runtime-env:
  requires-database: true
  values:
    database.default.hostname:
      from: "database.host"
    database.default.port:
      from: "database.port"
    database.default.database:
      from: "database.name"
    database.default.username:
      from: "database.user"
    database.default.password:
      from: "database.password"
    database.default.DBDriver:
      by-engine:
        mysql: "MySQLi"
        mariadb: "MySQLi"
        postgresql: "Postgre"
script:
  file: "scripts/codeigniter.star"
  hooks:
    - "post_composer"
post-composer:
  requires-database: true
